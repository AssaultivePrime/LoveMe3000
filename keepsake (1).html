<script>
/* PWA: icons + manifest generated at runtime (single-file app) */
(function () {
  try {
    const icon = size => {
      const c = document.createElement("canvas"); c.width = c.height = size;
      const x = c.getContext("2d");
      const g = x.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, "#ff9e8f"); g.addColorStop(1, "#8b6bff");

      x.fillStyle = "#fff"; x.translate(size / 2, size * 0.56); const k = size / 100;
      x.beginPath(); x.moveTo(0, 28 * k);
      x.bezierCurveTo(-46 * k, -4 * k, -30 * k, -40 * k, 0, -18 * k);
      x.bezierCurveTo(30 * k, -40 * k, 46 * k, -4 * k, 0, 28 * k);
      x.fill();
      return c.toDataURL("image/png");
    };
    const i180 = icon(180), i192 = icon(192), i512 = icon(512);
    const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = i180; document.head.appendChild(l);
    const f = document.createElement("link"); f.rel = "icon"; f.type = "image/png"; f.href = i192; document.head.appendChild(f);
    if (/^https?:/.test(location.protocol)) {
      const base = location.href.split("#")[0];
      const manifest = {
        name: "LoveMe3000", short_name: "LoveMe3000", start_url: base, scope: base.replace(/[^/]*$/, ""),
        display: "fullscreen", display_override: ["fullscreen", "standalone"], orientation: "portrait",
        background_color: "#17131f", theme_color: "#17131f",
        icons: [{ src: i192, sizes: "192x192", type: "image/png", purpose: "any" }, { src: i512, sizes: "512x512", type: "image/png", purpose: "any" }]
      };

      m.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));

<title>LoveMe3000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Caveat:wght@500;600&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17131f;
    --surface: #221c2e;
    --surface-2: #2b2339;
    --line: #362d47;
    --text: #f6f1ea;
    --muted: #a79fb5;
    --ink: #1d1527;
    --accent: #ffd166;
    --danger: #ff8a80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; background: #17131f; }
  html { -webkit-text-size-adjust: 100%; }
  body { position: fixed; inset: 0; width: 100%; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  input, textarea, select, [contenteditable], .selectable { -webkit-user-select: text; user-select: text; }
  body {
    background: #050505; color: var(--text);
    font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; align-items: center;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; text-align: left; }
  input, select, textarea { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app :focus-visible { outline-color: var(--accent); }

  .app {
    position: relative; width: 100%; max-width: 420px; height: 100%; max-height: 900px;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
  }
  @media (min-width: 500px) and (min-height: 600px) and (hover: hover) { .app { height: 92vh; border-radius: 38px; border: 1px solid var(--line); } }
  /* Phones: truly borderless, edge to edge (status bar + home indicator area belong to the app) */
  @media (max-width: 499px), (hover: none) {
    body { background: var(--bg, #17131f); }
    .app { max-width: none; max-height: none; width: 100%; height: 100%; height: 100dvh; border-radius: 0; border: 0; }
  }
  main { overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }

  /* Boot splash: shown until auth state is known */
  #boot { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--bg, #17131f); transition: opacity .3s ease, visibility .3s; }
  #boot.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #boot .heart { width: 56px; height: 56px; color: var(--accent, #ffd166); animation: bootbeat 1.1s ease-in-out infinite; }
  #boot small { color: var(--muted, #a79fb5); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  @keyframes bootbeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @media (prefers-reduced-motion: reduce) { #boot .heart { animation: none; } }

  /* Tiny scrollbar */
  main, .panel { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.16) transparent; }
  main::-webkit-scrollbar, .panel::-webkit-scrollbar { width: 2px; }
  main::-webkit-scrollbar-track, .panel::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb, .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 2px; }
  .row-scroll { scrollbar-width: none; }
  .row-scroll::-webkit-scrollbar { display: none; }

  main { flex: 1; overflow-y: auto; padding: 0 20px 28px; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  [hidden] { display: none !important; }

  /* Headers */
  .head { display: flex; align-items: center; justify-content: space-between; padding: 26px 0 0; gap: 12px; }
  .head h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
  .head .sub { color: var(--muted); font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .round { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
  h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; margin: 28px 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 small { font-size: 13px; font-weight: 600; color: var(--muted); }

  /* Daily note */
  .daily-notes { margin-top: 22px; }
  .daily-notes-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .daily-notes-head b { font-size: 15px; }
  .daily-notes-head small { color: var(--muted); font-size: 12px; }
  .daily-note-card { overflow: hidden; border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 12px; }
  .daily-note-compose { display: flex; align-items: center; gap: 12px; width: 100%; }
  .daily-note-avatar { position: relative; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; flex: none; color: var(--ink); font-weight: 800; background: linear-gradient(135deg, #ff9e8f, #c3a6ff); }
  .daily-note-avatar::after { content: "+"; position: absolute; right: -2px; bottom: -2px; width: 19px; height: 19px; border: 2px solid var(--surface); border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--ink); font-size: 14px; line-height: 1; }
  .daily-note-copy { flex: 1; min-width: 0; }
  .daily-note-copy b { display: block; font-size: 14px; }
  .daily-note-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
  .daily-note-song { display: inline-flex; align-items: center; gap: 6px; margin: 10px 0 0 60px; color: var(--text); font-size: 12px; font-weight: 700; text-decoration: none; }
  .daily-note-song .spotify-mark { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #1ed760; color: #071b0d; font-size: 14px; }
  .daily-note-player { display: block; width: 100%; height: 80px; border: 0; border-radius: 12px; margin-top: 10px; }
  .partner-note { margin-top: 12px; }
  .partner-note .daily-note-avatar::after { display: none; }
  .partner-note-empty { margin: 10px 0 0 60px; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .partner-note .daily-note-avatar { overflow: hidden; }
  .partner-note .daily-note-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .partner-note button.daily-note-compose { cursor: pointer; border-radius: 14px; }
  .partner-note button.daily-note-compose > svg.i { color: var(--muted); }
  .profile-back { position: absolute; top: 16px; left: 20px; width: 42px; height: 42px; border-radius: 50%; background: rgba(11,9,16,.55); backdrop-filter: blur(6px); color: #fff; display: grid; place-items: center; z-index: 2; }

  /* Search field */
  .search { margin-top: 18px; height: 52px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--muted); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font-size: 16px; }
  .search input::placeholder { color: var(--muted); }
  .search:focus-within { border-color: var(--accent); }

  /* Chips */
  .chips { display: flex; gap: 8px; overflow-x: auto; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .chip svg.i { width: 18px; height: 18px; }
  .chip.on { background: var(--text); color: var(--ink); border-color: var(--text); }

  /* Tiles */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { height: 132px; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; color: var(--ink); transition: transform .12s ease; }
  .tile:active { transform: scale(.97); }
  .tile.new { border: 2px dashed var(--line); color: var(--muted); align-items: flex-start; }
  .badge { width: 40px; height: 40px; border-radius: 14px; background: rgba(29,21,39,.14); display: grid; place-items: center; }
  .tile.new .badge { background: var(--surface); }
  .tile b { display: block; font-size: 17px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .tile small { display: block; font-size: 12.5px; font-weight: 500; opacity: .7; margin-top: 3px; }

  /* Empty state */
  .empty { margin-top: 26px; border: 2px dashed var(--line); border-radius: 26px; padding: 30px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .empty .big { width: 60px; height: 60px; border-radius: 20px; background: var(--surface); display: grid; place-items: center; margin-bottom: 6px; color: var(--accent); }
  .empty b { font-size: 18px; }
  .empty p { color: var(--muted); font-size: 14.5px; line-height: 1.45; max-width: 280px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--text); color: var(--ink); font-weight: 700; font-size: 15px; padding: 12px 20px; border-radius: 999px; margin-top: 12px; }
  .btn.accent { background: var(--accent); }
  .btn.full { width: 100%; justify-content: center; border-radius: 16px; padding: 15px; margin-top: 20px; }
  .btn svg.i { width: 20px; height: 20px; }
  .btn:disabled { opacity: .6; cursor: default; }

  /* Quick cards */
  .row-scroll { display: flex; gap: 12px; overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  .quick { flex: none; width: 130px; border-radius: 20px; background: var(--surface); padding: 12px; }
  .quick .sq { width: 100%; height: 70px; border-radius: 14px; display: grid; place-items: center; color: var(--ink); margin-bottom: 10px; }
  .quick b { display: block; font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quick small { color: var(--muted); font-size: 12.5px; }
  .quick.new { background: none; border: 2px dashed var(--line); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; }

  /* List rows */
  .list { display: flex; flex-direction: column; gap: 4px; }
  .memory-wall { columns: 2; column-gap: 12px; margin-top: 16px; }
  .memory-card { display: block; position: relative; width: 100%; min-height: 150px; margin: 0 0 12px; padding: 0; overflow: hidden; border-radius: 18px; background: var(--surface); break-inside: avoid; }
  .memory-card .cover { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 150px; background-position: center; background-size: cover; color: var(--ink); }
  .memory-card:nth-child(4n + 1) .cover, .memory-card:nth-child(4n + 3) .cover { aspect-ratio: 1 / 1.2; }
  .memory-card:nth-child(4n + 2) .cover { aspect-ratio: 1 / .88; }
  .memory-card:nth-child(4n) .cover { aspect-ratio: 1 / 1.05; }
  .memory-card .cover > svg.i { width: 34px; height: 34px; }
  .memory-card .folder-mark { position: absolute; top: 10px; left: 10px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); background: rgba(255,255,255,.82); backdrop-filter: blur(6px); }
  .memory-card .folder-mark svg.i { width: 19px; height: 19px; }
  .memory-card .card-title { position: absolute; inset: auto 0 0; padding: 34px 12px 11px; color: #fff; text-align: left; font-size: 14px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; background: linear-gradient(transparent, rgba(0,0,0,.78)); }
  .memory-card .card-date { display: block; margin-top: 4px; font-size: 11px; font-weight: 500; opacity: .82; }
  .memory-wall .none { column-span: all; }
  @media (max-width: 350px) { .memory-wall { column-gap: 8px; } .memory-card { margin-bottom: 8px; border-radius: 14px; } }
  .item { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .sq { background-size: cover; background-position: center; }
  .item .sq { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: var(--ink); flex: none; }
  .sq.hasimg svg { display: none; }
  .item .txt { flex: 1; min-width: 0; }
  .item b { display: block; font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); flex: none; }
  .fav.on { color: var(--danger); }
  .fav.on svg { fill: var(--danger); }
  .none { color: var(--muted); padding: 16px 0; font-size: 15px; line-height: 1.45; }

  /* Folder hero / memory top */
  .hero { margin: 0 -20px; padding: calc(18px) 20px 24px; color: var(--ink); border-radius: 0 0 30px 30px; }
  .hero .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hero .ibtn { width: 42px; height: 42px; border-radius: 50%; background: rgba(29,21,39,.14); display: grid; place-items: center; }
  .hero .ibtn.on svg { fill: var(--ink); }
  .hero .acts { display: flex; gap: 8px; }
  .hero h1 { font-size: 32px; letter-spacing: -0.03em; line-height: 1.08; margin-top: 24px; overflow-wrap: anywhere; }
  .hero p { font-weight: 600; opacity: .7; margin-top: 6px; font-size: 14.5px; }
  .crumb { display: inline-flex; align-items: center; gap: 6px; background: rgba(29,21,39,.14); padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; margin-top: 10px; }
  .crumb svg.i { width: 16px; height: 16px; }

  .desc { margin-top: 18px; line-height: 1.55; font-size: 15.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .desc.muted { color: var(--muted); }

  /* Media */
  .picks { display: flex; gap: 8px; flex-wrap: wrap; }
  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .ph { position: relative; aspect-ratio: 1; }
  .phimg { width: 100%; height: 100%; border-radius: 18px; background: var(--surface) center / cover no-repeat; display: block; }
  .rm { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: rgba(11,9,16,.7); display: grid; place-items: center; color: #fff; z-index: 2; }
  .rm svg.i { width: 16px; height: 16px; }
  .vid { position: relative; margin-bottom: 12px; border-radius: 18px; overflow: hidden; background: #000; }
  .vid video { width: 100%; display: block; max-height: 300px; }
  .vid .rm { top: 10px; right: 10px; }
  .aud { position: relative; display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 18px; padding: 12px 46px 12px 12px; margin-bottom: 12px; }
  .aud .ic { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--accent); }
  .aud .meta { flex: 1; min-width: 0; }
  .aud b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
  .aud audio { width: 100%; height: 34px; }
  .aud .rm { top: 10px; right: 10px; background: var(--surface-2); }

  /* Profile */
  .profile-page { --profile-accent: var(--accent); --profile-ink: var(--text); --profile-surface: var(--surface); --profile-muted: var(--muted); color: var(--profile-ink); font-family: var(--profile-font, inherit); background: var(--profile-page-bg, transparent); margin: 0 -20px; padding: 0 20px 16px; border-radius: 0 0 22px 22px; }
  .profile-page[data-layout="editorial"] .profile-identity { align-items: flex-start; text-align: left; }
  .profile-page[data-layout="editorial"] .profile-identity h1 { font-family: Georgia, serif; font-size: 34px; }
  .profile-page[data-layout="editorial"] .profile-cover { border-radius: 0; }
  .profile-page[data-layout="cards"] .profile-identity, .profile-page[data-layout="cards"] .profile-song, .profile-page[data-layout="cards"] .profile-bio { background: var(--profile-surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
  .profile-page[data-layout="cards"] .profile-identity { margin-top: -44px; }
  .profile-page[data-avatar="rounded"] .av { border-radius: 24px; }
  .profile-page[data-avatar="square"] .av { border-radius: 12px; }
  .profile-cover { position: relative; height: var(--profile-banner-height, 170px); margin: 0 -20px; background: linear-gradient(135deg, #654b85, #c3a6ff 55%, #ff9e8f); background-position: center; background-size: cover; border-radius: 0 0 24px 24px; }
  .profile-identity { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: -48px; position: relative; }
  .av { width: var(--profile-avatar-size, 96px); height: var(--profile-avatar-size, 96px); border: 4px solid var(--bg); border-radius: 50%; display: grid; place-items: center; overflow: hidden; font-weight: 800; font-size: 34px; color: var(--ink); background: linear-gradient(135deg, #ff9e8f, #c3a6ff) center / cover; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .profile-customize-intro { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 8px 0 14px; }
  .profile-style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .profile-style-option { border: 1px solid var(--line); border-radius: 13px; padding: 8px; background: var(--bg); text-align: center; font-size: 12px; font-weight: 700; }
  .profile-style-option[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .crop-workbench { display: none; margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); }
  .crop-workbench.open { display: block; }
  .crop-workbench canvas { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px; background: #09070d; display: block; }
  .crop-workbench[data-kind="avatar"] canvas { width: min(100%, 220px); margin: auto; aspect-ratio: 1; }
  .crop-workbench .crop-controls { display: grid; gap: 8px; margin-top: 10px; }
  .crop-workbench input[type="range"] { width: 100%; accent-color: var(--accent); }
  .crop-workbench small { color: var(--muted); font-size: 12px; }
  .profile-live-preview { position: sticky; top: -22px; z-index: 5; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; margin: 14px 0 18px; background: var(--preview-bg, var(--surface)); color: var(--preview-text, var(--text)); box-shadow: 0 12px 30px rgba(0,0,0,.28); }
  .profile-live-preview::before { content: "LIVE PAGE PREVIEW"; display: block; padding: 8px 12px; color: var(--muted); background: var(--surface); font-size: 10px; font-weight: 800; letter-spacing: .14em; }
  .profile-live-preview .mini-banner { height: 92px; background: linear-gradient(135deg, #654b85, #c3a6ff 55%, #ff9e8f) center/cover; }
  .profile-live-preview .mini-content { display: flex; align-items: center; gap: 12px; padding: 0 14px 12px; margin-top: -28px; position: relative; color: var(--preview-text, var(--text)); }
  .profile-live-preview .mini-avatar { width: 60px; height: 60px; flex: none; border: 3px solid var(--surface); border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #ff9e8f,#c3a6ff); font-weight: 800; font-size: 22px; color: var(--ink); overflow: hidden; }
  .profile-live-preview .mini-avatar img { width:100%; height:100%;object-fit:cover; }
  .profile-live-preview .mini-name { font-weight: 800; font-size: 16px; }

  /* Tab bar */
  nav { display: flex; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 8px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .tab .pill { width: 56px; height: 32px; border-radius: 999px; display: grid; place-items: center; transition: background .15s; }
  .tab[aria-current="page"] { color: var(--text); }
  .tab[aria-current="page"] .pill { background: var(--surface-2); }

  /* Auth */
  .auth { flex: 1; overflow-y: auto; padding: 48px 24px 32px; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 64px; height: 64px; border-radius: 22px; background: linear-gradient(135deg, #ff9e8f, #c3a6ff); display: grid; place-items: center; color: var(--ink); margin-bottom: 18px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 14px; padding: 4px; margin-top: 26px; }
  .seg button { text-align: center; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 14.5px; color: var(--muted); }
  .seg button[aria-selected="true"] { background: var(--surface-2); color: var(--text); }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 12px; }
  .fine { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin-top: 18px; text-align: center; }

  /* Forms */
  .field { display: block; margin-top: 14px; }
  .field > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; font-size: 16px; outline: 0; }
  .field textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field input[type="date"] { color-scheme: dark; }

  /* Sheet */
  .sheet { position: absolute; inset: 0; z-index: 20; display: none; }
  .sheet.open { display: block; }
  .backdrop { position: absolute; inset: 0; background: rgba(5,3,10,.62); }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 28px 28px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 90%; overflow-y: auto; animation: up .2s ease; }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel .ph-head { display: flex; justify-content: space-between; align-items: center; }
  .panel h3 { font-size: 21px; letter-spacing: -0.02em; }
  .panel .field input, .panel .field select, .panel .field textarea { background: var(--bg); }
  .swatches, .icons { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatches label, .icons label { position: relative; cursor: pointer; }
  .swatches input, .icons input { position: absolute; opacity: 0; inset: 0; }
  .swatches span { display: block; width: 36px; height: 36px; border-radius: 50%; }
  .swatches input:checked + span { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px #fff; }
  .icons span { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--bg); color: var(--muted); }
  .icons input:checked + span { background: var(--text); color: var(--ink); }
  .swatches input:focus-visible + span, .icons input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 3px; }
  .linkbtn { width: 100%; text-align: center; padding: 14px; font-weight: 700; color: var(--danger); margin-top: 6px; }

  .lightbox { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.94); display: none; place-items: center; padding: 16px; }
  .lightbox.open { display: grid; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; }
  .lightbox .x { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; }

  .toast { position: absolute; left: 50%; bottom: 88px; transform: translate(-50%, 20px); background: var(--text); color: var(--ink); padding: 11px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; z-index: 40; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Theme gallery */
  .theme-intro { color: var(--muted); line-height: 1.5; margin: 8px 0 18px; font-size: 14px; }
  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 20px; }

  .theme-meta small { color: var(--muted); font-size: 11px; }
  .theme-meta .check { color: var(--accent); font-size: 11px; font-weight: 800; }

const memStore = {};
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return k in memStore ? JSON.parse(memStore[k]) : d; } },
  set(k, v) { const s = JSON.stringify(v); try { localStorage.setItem(k, s); return true; } catch { memStore[k] = s; return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} delete memStore[k]; }
};
let dbp;
const db = () => dbp || (dbp = new Promise((res, rej) => {
  try {
    const r = indexedDB.open("keepsake", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("media");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  } catch (e) { rej(e); }
}));
const tx = async (mode, fn) => {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction("media", mode), st = t.objectStore("media");
    const req = fn(st);
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
};
const mput = (id, rec) => tx("readwrite", s => s.put(rec, id));
const mget = id => tx("readonly", s => s.get(id));

const urls = new Map(), inflight = new Map(), memBlobs = new Map(); // memBlobs: session-only fallback when IndexedDB is blocked
async function murl(id, cloud) {
  const direct = remoteUrl(id);
  if (direct) return direct;
  if (urls.has(id)) return urls.get(id);
  if (inflight.has(id)) return inflight.get(id);
  const job = (async () => {
    try {
      let rec = memBlobs.get(id) || null;
      if (!rec) { try { rec = await mget(id); } catch {} }
      if (!rec && cloud && S.user && S.user.firebase && window.fetchKeepsakeMedia) {
        const c = await window.fetchKeepsakeMedia(id);
        if (c && c.dataUrl) {
          const blob = await (await fetch(c.dataUrl)).blob();
          rec = { blob, type: blob.type || "image/jpeg", name: c.name || "file" };
          try { await mput(id, rec); } catch {}
        }
      }
      if (!rec) return null;
      const u = URL.createObjectURL(rec.blob);
      urls.set(id, u);
      return u;
    } catch { return null; }
    finally { inflight.delete(id); }
  })();
  inflight.set(id, job);
  return job;
}
async function dropMedia(id) {
  try { await mdel(id); } catch {}
  if (S.user && S.user.firebase && window.deleteKeepsakeMedia) window.deleteKeepsakeMedia(id).catch(() => {});

}

    const url = new URL("https://api.themoviedb.org/3/search/movie");
    url.searchParams.set("api_key", tmdbApiKey);
    url.searchParams.set("query", query.trim());
    url.searchParams.set("include_adult", "false");
    const response = await fetch(url);
    if (!response.ok) throw new Error(response.status === 401 ? "That TMDb API key was rejected." : `TMDb search failed (${response.status}).`);
    const data = await response.json();
    if (requestId !== movieRequestId || $("#movie-results") !== results) return;
    S.movieResults = (data.results || []).slice(0, 8);
    results.innerHTML = S.movieResults.length ? S.movieResults.map(movie => movieCard(movie)).join("") : '<div class="movie-results-status">No movies found.</div>';
  } catch (error) {
    if (requestId === movieRequestId && $("#movie-results") === results) results.innerHTML = `<div class="movie-results-status">${esc(error.message || "Couldn't search TMDb. Check your connection and API key.")}</div>`;
  }
}

/* ---------- Routing / render ---------- */
const NAV_KEY = "keepsake:nav";
function saveNav() {
  if (!S.user || S.user.guest || S.pendingScroll != null || (S.user.firebase && !S.synced)) return;
  LS.set(NAV_KEY, { uid: S.user.id, tab: S.tab, stack: S.stack, q: S.q, filter: S.filter, scroll: view.scrollTop });
}
function restoreNav(uid) {
  const n = LS.get(NAV_KEY, null);
  if (n && n.uid === uid && Array.isArray(n.stack) && typeof n.tab === "string") {
    S.stack = n.stack; S.tab = n.tab; S.q = n.q || ""; S.filter = n.filter || "all"; S.pendingScroll = n.scroll || 0;
  } else { S.stack = []; S.tab = "home"; S.q = ""; S.filter = "all"; S.pendingScroll = null; }
}
const clearNav = () => LS.del(NAV_KEY);
function bootDone() {
  const ready = S.authReady && (!S.user || !S.user.firebase || S.synced);
  const b = document.getElementById("boot");
  if (b && ready && !b.classList.contains("hide")) { b.classList.add("hide"); setTimeout(() => b.remove(), 400); }
}
function route() {
  if (!S.authReady) return;
  bootDone();
  if (!S.user) { tabsEl.hidden = true; renderAuth(); return; }
  if (S.user.firebase && !S.synced) { tabsEl.hidden = true; view.innerHTML = '<p class="none" style="text-align:center;padding-top:40vh">Loading your memories…</p>'; return; }
  const top = S.stack[S.stack.length - 1];
  if (top && top.partnerProfile) view.innerHTML = renderPartnerProfile();
  else if (top && top.moreSub) view.innerHTML = renderMoreSub(top.moreSub);
  else if (top && top.customize) view.innerHTML = renderCustomize();
  else if (top && top.memId) view.innerHTML = renderMemory(top.memId);
  else if (top && top.folderId) view.innerHTML = renderFolder(top.folderId);
  else view.innerHTML = { home: renderHome, search: renderSearch, chat: renderChat, library: renderLibrary, profile: renderProfile, more: renderMore }[S.tab]();
  tabsEl.hidden = false;
  tabsEl.innerHTML = [["home", "Home", "home"], ["search", "Search", "search"], ["chat", "Chat", "chat"], ["library", "Library", "library"], ["profile", "Profile", "user"], ["more", "More", "more"]]
    .map(([id, l, ic]) => `<button class="tab" data-tab="${id}" ${S.tab === id && (!top || top.partnerProfile || (top.customize && id === "profile") || (top.moreSub && id === "more")) ? 'aria-current="page"' : ""}><span class="pill">${ico(ic)}</span>${l}</button>`).join("");
  if (!top && S.tab === "search") updateSearch();
  hydrate(view);
  if (top && top.memId) { layoutNotes(); observeNotes(); }
}
function render(keepScroll = true) {
  const y = view.scrollTop;
  route();
  const loading = S.user && S.user.firebase && !S.synced;
  if (S.pendingScroll != null && S.user && !loading) {
    const t = S.pendingScroll; S.pendingScroll = null;
    view.scrollTop = t; requestAnimationFrame(() => { view.scrollTop = t; setTimeout(() => { view.scrollTop = t; }, 250); });
  } else view.scrollTop = keepScroll ? y : 0;
  saveNav();
}
let navTimer;
view.addEventListener("scroll", () => { clearTimeout(navTimer); navTimer = setTimeout(saveNav, 250); }, { passive: true });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNav(); });
window.addEventListener("pagehide", saveNav);
function go(entry) { S.stack.push(entry); render(false); }

async function hydrate(root) {
  const els = [...root.querySelectorAll("[data-mid]")];
  await Promise.all(els.map(async el => {
    const u = await murl(el.dataset.mid, el.dataset.kind === "bg" || el.tagName === "AUDIO");
    if (!u) { if (el.dataset.kind === "src") el.replaceWith(Object.assign(document.createElement("small"), { textContent: "Not available on this device", style: "color:var(--muted);font-size:12px" })); return; }
    if (!el.isConnected) return;
    if (el.dataset.kind === "bg") { el.style.backgroundImage = `url("${u}")`; el.classList.add("hasimg"); }
    else el.src = u;
  }));
}

let profileCropState = { avatar: null, banner: null };
function drawProfileCrop(kind) {
  const state = profileCropState[kind], canvas = $(`#crop-${kind} canvas`);
  if (!state || !canvas) return;
  const ctx = canvas.getContext("2d"), image = state.image;
  const targetRatio = canvas.width / canvas.height;
  let cropW = image.width, cropH = image.height;
  if (cropW / cropH > targetRatio) cropW = cropH * targetRatio;
  else cropH = cropW / targetRatio;
  cropW /= state.zoom; cropH /= state.zoom;
  const left = Math.max(0, Math.min(image.width - cropW, state.x * image.width - cropW / 2));
  const top = Math.max(0, Math.min(image.height - cropH, state.y * image.height - cropH / 2));
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(image, left, top, cropW, cropH, 0, 0, canvas.width, canvas.height);
  const preview = kind === "avatar" ? $("#profile-mini-avatar") : $("#profile-mini-banner");
  if (preview) preview.style.backgroundImage = kind === "banner" ? `url("${canvas.toDataURL("image/jpeg", 0.72)}")` : "";
  if (kind === "avatar" && preview) preview.innerHTML = `<img src="${canvas.toDataURL("image/jpeg", 0.72)}" alt="">`;
}
async function croppedProfileImage(kind) {
  const state = profileCropState[kind];
  if (!state) return "";
  const canvas = $(`#crop-${kind} canvas`);
  let quality = 0.82, data = canvas.toDataURL("image/jpeg", quality);
  while (data.length > 240000 && quality > 0.38) { quality -= 0.1; data = canvas.toDataURL("image/jpeg", quality); }
  if (data.length > 240000) throw new Error("That crop is too large. Try a smaller image or a tighter crop.");
  return data;
}

async function profileImage(file, maxSize) {
  if (!file) return "";
  if (!file.type.startsWith("image/")) throw new Error("Choose an image file.");
  const image = await createImageBitmap(file);
  const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(image.width * scale));
  canvas.height = Math.max(1, Math.round(image.height * scale));
  canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
  let quality = 0.78, data = canvas.toDataURL("image/jpeg", quality);
  while (data.length > 240000 && quality > 0.38) { quality -= 0.1; data = canvas.toDataURL("image/jpeg", quality); }
  while (data.length > 240000 && canvas.width > 320) {
    canvas.width = Math.round(canvas.width * 0.75);
    canvas.height = Math.round(canvas.height * 0.75);
    canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
    data = canvas.toDataURL("image/jpeg", 0.65);
  }
  image.close();
  if (data.length > 240000) throw new Error("That image is too large. Choose a smaller image.");
  return data;
}

const MAX_IMG_CHARS = 900000; // stays safely under Firestore's 1 MiB document limit
async function compressImage(file) {
  const bmp = await createImageBitmap(file);
  let scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  let w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
  const canvas = document.createElement("canvas");
  try {
    for (let attempt = 0; attempt < 6; attempt++) {
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(bmp, 0, 0, w, h);
      for (let q = 0.85; q >= 0.45; q -= 0.1) {
        const data = canvas.toDataURL("image/jpeg", q);
        if (data.length <= MAX_IMG_CHARS) return data;
      }
      w = Math.round(w * 0.8); h = Math.round(h * 0.8);
    }
  } finally { if (bmp.close) bmp.close(); }
  throw new Error("Image too large");
}
const IMGBB_API_KEY = "275d0f8c45521f6fed15caa3434dd679";
async function uploadToImgBB(dataUrl, name) {
  if (S.user && S.user.guest) throw new Error("Guest mode keeps files on this device only");
  const fd = new FormData();
  fd.append("image", dataUrl.split(",")[1]); // base64 only, no "data:" prefix
  if (name) fd.append("name", name.replace(/\.[^.]+$/, ""));
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: fd });
  const json = await res.json();
  if (!json.success) throw new Error((json.error && json.error.message) || "ImgBB upload failed");
  return json.data.url;
}
const remoteUrl = id => {

  return "";
};
let uploadTimer, uploading = false;
async function uploadLocalImages() {
  if (uploading || !S.user || !S.user.firebase) return;
  uploading = true;
  try {
    let changed = false;
    for (const m of S.data.memories) for (const x of m.media) {
      if (x.kind !== "image" || x.url) continue;
      try {
        const rec = await mget(x.id);
        let dataUrl = rec ? await compressImage(rec.blob) : null;
        if (!dataUrl && window.fetchKeepsakeMedia) { const c = await window.fetchKeepsakeMedia(x.id); dataUrl = c && c.dataUrl; }
        if (!dataUrl) continue;
        x.url = await uploadToImgBB(dataUrl, x.name);
        changed = true;
      } catch (e) { console.warn("Migration skipped:", e); }
    }
    if (changed) save(); // pushes the new urls to Firestore
  } finally { uploading = false; }
}
const MAX_AUDIO_BYTES = 650000; // base64 adds ~33%, keeps the Firestore doc under 1 MiB
async function addFiles(files, pickKind) {
  const top = S.stack[S.stack.length - 1];
  const m = top && top.memId && mem(top.memId);
  if (!m || !files.length) return;
  toast("Saving…");
  let ok = 0, localOnly = 0, failed = 0, uploadFailed = 0, audioTooBig = 0, sessionOnly = 0, lastErr = "";
  for (const file of files) {
    const t = file.type || "";
    const kind = t.startsWith("image/") ? "image" : t.startsWith("video/") ? "video" : t.startsWith("audio/") ? "audio" : pickKind;
    const id = uid();
    let url = "";
    try {
      if (kind === "image") {
        const dataUrl = await compressImage(file);
        try { url = await uploadToImgBB(dataUrl, file.name); }   // cloud link
        catch (upErr) { console.error("ImgBB upload failed:", upErr); lastErr = upErr.message || String(upErr); uploadFailed++; }
        try {
          const blob = await (await fetch(dataUrl)).blob();
          await mput(id, { blob, type: "image/jpeg", name: file.name }); // local cache (optional)
        } catch (cacheErr) {
          console.warn("Local cache unavailable:", cacheErr);
          try { memBlobs.set(id, { blob: await (await fetch(dataUrl)).blob(), type: "image/jpeg", name: file.name }); } catch {}
          if (!url) throw new Error("Upload failed and local storage is blocked here: " + (lastErr || cacheErr.message));
        }
      } else {
        let synced = false;
        if (kind === "audio" && S.user.firebase && window.saveKeepsakeMedia) {
          if (file.size > MAX_AUDIO_BYTES) { lastErr = "Audio over 650 KB stays on this device only. Keep voice notes short to sync."; audioTooBig++; }
          else {
            try {
              const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
              await window.saveKeepsakeMedia(id, { kind: "audio", name: file.name, memId: m.id, dataUrl });
              synced = true;
            } catch (upErr) { console.error("Audio sync failed:", upErr); lastErr = upErr.message || String(upErr); uploadFailed++; }
          }
        }
        try { await mput(id, { blob: file, type: t, name: file.name }); }
        catch (e) { console.warn("Local cache unavailable:", e); memBlobs.set(id, { blob: file, type: t, name: file.name }); sessionOnly++; }
        if (!synced) localOnly++;
      }
      m.media.push({ id, kind, name: file.name, ...(url && { url }) });
      ok++;
    } catch (error) { console.error(error); lastErr = error.message || String(error); failed++; }
  }
  if (ok) save();
  if (failed) toast("Couldn't add: " + (lastErr || "unknown error"));
  else if (uploadFailed) toast("Saved on this device only. Upload failed: " + lastErr);
  else if (audioTooBig) toast(lastErr);
  else if (sessionOnly && !localOnly) { /* synced to cloud; local cache blocked */ }
  else if (sessionOnly) toast("Browser storage is blocked, so this will disappear on reload. Open the file in a normal tab.");
  else if (localOnly && S.user.firebase) toast("Videos stay on this device only");
  else if (ok) toast(`Added ${plural(ok, "file")}`);
  render();
}

const setErr = msg => { const el = $("#autherr") || $("#sheeterr"); if (el) el.textContent = msg; };

document.addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, fd = new FormData(form);
  if (form.id === "profileform") {
    const rawSpotify = (fd.get("spotify") || "").trim();
    const spotify = rawSpotify ? spotifyTrack(rawSpotify) : null;
    if (rawSpotify && !spotify) return setErr("Paste a Spotify track link from open.spotify.com.");
    try {
      const current = S.profile || {};
      const avatarFile = fd.get("avatar"), bannerFile = fd.get("banner");
      const chosenPageColor = fd.get("pageColor") || fd.get("pageColorCustom");
      const profile = {
        name: S.user.name, uid: S.user.id, theme: current.theme || activeThemeId,
        bio: (fd.get("bio") || "").trim(),
        songTitle: (fd.get("songTitle") || "").trim(),
        spotify: spotify ? spotify.href : "",
        favoriteMovies: profileDraftMovies,
        layout: ["classic", "editorial", "cards"].includes(fd.get("layout")) ? fd.get("layout") : "classic",
        avatarShape: ["circle", "rounded", "square"].includes(fd.get("avatarShape")) ? fd.get("avatarShape") : "circle",
        font: ["rounded", "serif", "mono"].includes(fd.get("font")) ? fd.get("font") : "rounded",
        avatarSize: Math.min(140, Math.max(72, Number(fd.get("avatarSize")) || 96)),
        bannerHeight: Math.min(280, Math.max(120, Number(fd.get("bannerHeight")) || 170)),
        pageColor: /^#[0-9a-f]{6}$/i.test(chosenPageColor || "") ? chosenPageColor : current.pageColor || "",
        textColor: /^#[0-9a-f]{6}$/i.test(fd.get("textColor") || "") ? fd.get("textColor") : current.textColor || "",
        accentColor: /^#[0-9a-f]{6}$/i.test(fd.get("accentColor") || "") ? fd.get("accentColor") : current.accentColor || "",
        avatar: fd.get("removeAvatar") ? "" : (profileCropState.avatar ? await croppedProfileImage("avatar") : (avatarFile && avatarFile.size ? await profileImage(avatarFile, 600) : current.avatar || "")),
        banner: fd.get("removeBanner") ? "" : (profileCropState.banner ? await croppedProfileImage("banner") : (bannerFile && bannerFile.size ? await profileImage(bannerFile, 1400) : current.banner || ""))
      };
      S.profile = profile;
      LS.set("keepsake:profile:" + S.user.id, profile);
      if (S.user.firebase && window.saveKeepsakeProfile) await window.saveKeepsakeProfile(profile);
      closeSheet(); render(); toast("Profile updated");
    } catch (error) { setErr(error.message || window.firebaseErrorMessage(error)); }
  }
  else if (form.id === "authform") {
    const email = (fd.get("email") || "").trim().toLowerCase(), pw = fd.get("password") || "";
    if (!/^\S+@\S+\.\S+$/.test(email)) return setErr("Enter a valid email address.");
    if (!pw) return setErr("Enter your password.");
    try {
      if (!window.firebaseReady) return setErr("Firebase is still starting. Please try again.");
      await window.firebaseReady;
      await window.firebaseLogin(email, pw);
    } catch (error) {
      console.error("Firebase authentication failed:", error);
      setErr(window.firebaseErrorMessage(error));
    }
  }
  else if (form.id === "dailyform") {
    const text = (fd.get("text") || "").trim();
    const songTitle = (fd.get("songTitle") || "").trim();
    const rawSpotify = (fd.get("spotify") || "").trim();
    const spotify = rawSpotify ? spotifyTrack(rawSpotify) : null;
    if (!text && !rawSpotify) return setErr("Add a note or a Spotify track.");
    if (rawSpotify && !spotify) return setErr("Paste a Spotify track link from open.spotify.com.");
    S.dailyNote = { uid: S.user.id, name: S.user.name, date: today(), text, songTitle, spotify: spotify ? spotify.href : "" };
    LS.set("keepsake:daily-note:" + S.user.id, S.dailyNote);
    closeSheet(); render(); toast("Today's note saved");
    if (S.user.firebase && window.saveDailyNote) {
      try { await window.saveDailyNote(S.dailyNote); }
      catch (error) { console.error("Daily note save failed:", error); toast("Couldn't share your note"); }
    }
  }
  else if (form.id === "folderform") {
    const name = (fd.get("name") || "").trim();
    if (!name) return setErr("Give the folder a name.");
    const id = form.dataset.id;
    if (id) { Object.assign(folder(id), { name, color: fd.get("color"), icon: fd.get("icon") }); }
    else S.data.folders.push({ id: uid(), name, color: fd.get("color"), icon: fd.get("icon"), created: Date.now() });
    save(); closeSheet();
    const again = S.sheetReturn; S.sheetReturn = null;
    render();
    if (again === "newMem") memSheet();
    else toast(id ? "Folder updated" : "Folder created");
  }
  else if (form.id === "memform") {
    const title = (fd.get("title") || "").trim();
    if (!title) return setErr("Give the memory a title.");
    const id = form.dataset.id, vals = { title, date: fd.get("date") || today(), folderId: fd.get("folderId"), desc: (fd.get("desc") || "").trim() };
    if (id) { Object.assign(mem(id), vals); save(); closeSheet(); render(); toast("Memory updated"); }
    else {
      const m = { id: uid(), ...vals, fav: false, media: [], created: Date.now() };
      S.data.memories.push(m); save(); closeSheet(); go({ memId: m.id }); toast("Memory saved. Add photos or music.");
    }
  }
  else if (form.id === "nameform") {
    const name = (fd.get("name") || "").trim();
    if (!name) return setErr("Name can't be empty.");
    try {
      if (S.user.firebase) {
        await window.firebaseUpdateName(name);
        try {
          S.profile = { ...(S.profile || {}), name, uid: S.user.id };
          LS.set("keepsake:profile:" + S.user.id, S.profile);
          await window.saveKeepsakeProfile(S.profile);
        } catch (err) { console.warn("Profile name sync failed:", err); }
      }
      else setUsers(getUsers().map(u => u.id === S.user.id ? { ...u, name } : u));
      S.user.name = name; closeSheet(); render(); toast("Name updated");
    } catch (error) { setErr(window.firebaseErrorMessage(error)); }
  }
  else if (form.id === "pwform") {
    const current = fd.get("cur") || "", next = fd.get("next") || "";
    if (next.length < 6) return setErr("Use at least 6 characters.");
    try {
      await window.firebaseChangePassword(current, next);
      closeSheet(); toast("Password updated");
    } catch (error) { setErr(window.firebaseErrorMessage(error)); }
  }
});

  applyTheme(LS.get("keepsake:theme:" + u.id, "midnight"));
  const d = LS.get("keepsake:data:" + u.id, null);
  S.data = d && Array.isArray(d.folders) && Array.isArray(d.memories) ? d : { folders: [], memories: [] };
  if (!Array.isArray(S.data.dailyNotes)) S.data.dailyNotes = [];
  S.dailyNote = LS.get("keepsake:daily-note:" + u.id, null);
  S.partnerNote = null;
  S.stack = []; S.tab = "home"; S.q = ""; S.filter = "all"; S.profileMoviesExpanded = false; S.pendingScroll = null;
  render(false);
}

window.startFirebaseSession = (user, data, profile) => {
  S.synced = false; S.syncReady = {}; syncedDocs.folders = new Map(); syncedDocs.memories = new Map();
  S.user = { id: user.uid, name: user.displayName || (user.email || "Keepsake user").split("@")[0], email: user.email || "", firebase: true };
  S.profile = profile || LS.get("keepsake:profile:" + user.uid, {});

    ? data : { folders: [], memories: [], dailyNotes: [] };

window.updatePartnerDailyNotes = notes => {
  if (!S.user) return;
  const todaysNotes = (notes || []).filter(n => n.date === today());
  const own = todaysNotes.find(n => n.uid === S.user.id);
  if (own) {
    S.dailyNote = own;
    LS.set("keepsake:daily-note:" + S.user.id, own);
  }
  S.partnerNote = todaysNotes.find(n => n.uid !== S.user.id) || null;
  if (S.tab === "home" && !S.stack.length) render();
};
window.keepsakeHasData = () => S.data.folders.length > 0 || S.data.memories.length > 0;
window.keepsakeSyncFailed = () => { if (S.user && S.user.firebase) { S.synced = true; render(); } };
window.applyRemoteKeepsake = (kind, items) => {
  if (!S.user || !S.user.firebase) return;
  const next = new Map(items.map(it => [it.id, stable(it)]));
  const prev = syncedDocs[kind];
  const same = S.syncReady[kind] && prev.size === next.size && [...next].every(([k, v]) => prev.get(k) === v);
  syncedDocs[kind] = next;
  S.syncReady[kind] = true;
  if (same) return;
  S.data[kind] = kind === "folders" ? items.sort((a, b) => (a.created || 0) - (b.created || 0) || String(a.id).localeCompare(String(b.id))) : items;
  if (S.syncReady.folders && S.syncReady.memories) {
    const first = !S.synced;
    S.synced = true;
    if (!first && noteBusy()) pendingRender = true; else render();
    if (first && window.migrateLegacyKeepsake) window.migrateLegacyKeepsake();
    clearTimeout(uploadTimer); uploadTimer = setTimeout(uploadLocalImages, 1500);
  }
};
window.updatePartnerProfiles = list => {
  if (!S.user) return;
  S.profiles = list || [];
  const top = S.stack[S.stack.length - 1];
  if ((S.tab === "home" && !S.stack.length) || (top && top.partnerProfile)) render();

window.clearFirebaseSession = () => {
  S.authReady = true;
  if (S.user?.firebase) { clearNav(); S.user = null; S.stack = []; S.authMode = "login"; }

window.firebaseLoadError = message => toast(message);


/* ---------- Audio player ---------- */
const fmtT = t => { if (!isFinite(t)) return "0:00"; return Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0"); };
function plSync(a) {
  const p = a.closest("[data-player]"); if (!p) return;
  const d = isFinite(a.duration) ? a.duration : 0, seek = p.querySelector(".p-seek");
  p.querySelector("[data-pl-cur]").textContent = fmtT(a.currentTime);
  p.querySelector("[data-pl-dur]").textContent = fmtT(d);
  seek.value = d ? Math.round(a.currentTime / d * 1000) : 0;
  seek.style.setProperty("--p", (d ? a.currentTime / d * 100 : 0) + "%");
}
["timeupdate", "loadedmetadata", "durationchange", "ended"].forEach(ev => document.addEventListener(ev, e => { if (e.target.matches && e.target.matches("[data-player] audio")) plSync(e.target); }, true));
["play", "pause"].forEach(ev => document.addEventListener(ev, e => {
  const a = e.target; if (!a.matches || !a.matches("[data-player] audio")) return;
  const b = a.closest("[data-player]").querySelector('[data-pl="toggle"]');
  b.innerHTML = ico(a.paused ? "play" : "pause", "f"); b.setAttribute("aria-label", a.paused ? "Play" : "Pause");
  if (!a.paused) document.querySelectorAll("audio,video").forEach(o => { if (o !== a) o.pause(); });
}, true));
document.addEventListener("click", e => {
  const b = e.target.closest("[data-pl]"); if (!b) return;
  const a = b.closest("[data-player]").querySelector("audio");
  if (b.dataset.pl === "toggle") { a.paused ? a.play() : a.pause(); }
  else { a.muted = !a.muted; b.innerHTML = ico(a.muted ? "mute" : "volume"); b.setAttribute("aria-label", a.muted ? "Unmute" : "Mute"); }
});
document.addEventListener("input", e => {
  if (!e.target.classList || !e.target.classList.contains("p-seek")) return;
  const a = e.target.closest("[data-player]").querySelector("audio");
  if (isFinite(a.duration)) { a.currentTime = e.target.value / 1000 * a.duration; plSync(a); }
});


/* ---------- Post-its (placed over the memory page) ---------- */
const NOTE_COLORS = ["#fde68a", "#fbcfe8", "#bfdbfe", "#bbf7d0", "#fed7aa"];
const curMem = () => { const t = S.stack[S.stack.length - 1]; return t && t.memId ? mem(t.memId) : null; };
// geometry is stored as fractions of the page width so notes keep their place on any screen
const geo = n => { const legacy = n.y > 3 || n.h > 3; return { x: n.x || 0, y: legacy ? n.y / 380 : n.y || 0, w: n.w || 0.5, h: legacy ? n.h / 380 : n.h || 0.42 }; };
function noteHTML(n) {
  const pin = !!n.pinned;
  return `<div class="postit${pin ? " pinned" : ""}" data-note="${esc(n.id)}" style="background-color:${esc(n.color)};--rot:${Number(n.rot) || 0}deg">
    <div class="pi-bar" ${pin ? "" : "data-drag"}>
      <button class="pi-b pi-tool" data-note-act="pin" aria-pressed="${pin}" aria-label="${pin ? "Unstick note" : "Stick note"}">${ico("pin", pin ? "f" : "")}</button>
      ${pin ? '<span class="pi-tack"></span>' : '<span class="pi-grip"></span>'}
      <span><button class="pi-b pi-tool" data-note-act="color" aria-label="Change color">${ico("palette")}</button><button class="pi-b pi-tool" data-note-act="del" aria-label="Delete note">${ico("trash")}</button></span>
    </div>
    <textarea class="pi-text" data-note-text maxlength="400" placeholder="Write something…" aria-label="Post-it text" ${pin ? "readonly" : ""}>${esc(n.text || "")}</textarea>
    ${n.by ? `<span class="pi-by">${esc(n.by)}</span>` : ""}
    ${pin ? "" : '<span class="pi-resize" data-resize></span><span class="pi-rot" data-rotate aria-label="Rotate">' + ico("rotate") + '</span>'}
  </div>`;
}
/* Vertical positions are stored relative to #mm-anchor (the start of the photos/content area),
   so showing/hiding the edit-only blocks above it (Memory music, etc.) never moves stickers or post-its. */
function anchorPx(pg) {
  const a = pg && pg.querySelector("#mm-anchor"); if (!a) return 0;
  return a.getBoundingClientRect().top - pg.getBoundingClientRect().top;
}
// older items were saved relative to the page top while in edit mode: convert them once, in edit mode
function adoptAnchor(it, pg, isNote) {
  if (it.ay || pg.classList.contains("ro")) return;
  const bw = pg.clientWidth, A = anchorPx(pg); if (!bw) return;
  if (isNote) { const g = geo(it); it.x = g.x; it.w = g.w; it.h = g.h; it.y = g.y; }
  it.y = Math.round(((it.y || 0) - A / bw) * 1e4) / 1e4; it.ay = 1; save();
}
function layoutNotes() {
  const pg = $("#mempage"), m = curMem(); if (!pg || !m) return;
  const bw = pg.clientWidth, A = anchorPx(pg);
  pg.querySelectorAll(".postit").forEach(el => {
    const n = (m.notes || []).find(x => x.id === el.dataset.note); if (!n) return;
    adoptAnchor(n, pg, true);
    const g = geo(n);
    el.style.left = g.x * 100 + "%"; el.style.width = g.w * 100 + "%";
    el.style.top = g.y * bw + (n.ay ? A : 0) + "px"; el.style.height = g.h * bw + "px";
  });
}
function refreshNotes() {
  const m = curMem(), layer = $("#notelayer"); if (!m || !layer) return;
  layer.innerHTML = (m.notes || []).map(noteHTML).join("");
  layoutNotes();
}
let noteRO;
function observeNotes() {
  if (noteRO) noteRO.disconnect();
  const pg = $("#mempage"); if (!pg || !window.ResizeObserver) return;
  noteRO = new ResizeObserver(() => { if (!nd) layoutNotes(); });
  noteRO.observe(pg);
}
let nd = null, noteSaveTimer, pendingRender = false, zTop = 10;
const noteBusy = () => !!nd || !!(document.activeElement && document.activeElement.matches && document.activeElement.matches("[data-note-text],[data-tb-text],#viewer textarea"));
const flushPending = () => { if (pendingRender && !noteBusy()) { pendingRender = false; render(); } };
document.addEventListener("pointerdown", e => {
  const note = e.target.closest(".postit");
  document.querySelectorAll(".postit.sel").forEach(o => { if (o !== note) o.classList.remove("sel"); });
  if (note) { note.classList.add("sel"); note.style.zIndex = ++zTop; }
  const handle = e.target.closest("[data-drag],[data-resize]");
  if (!handle || e.target.closest("[data-note-act]")) return;
  const el = handle.closest(".postit"), pg = $("#mempage"); if (!el || !pg) return;
  e.preventDefault();
  nd = { el, mode: handle.hasAttribute("data-resize") ? "resize" : "drag", sx: e.clientX, sy: e.clientY, l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight, bw: pg.clientWidth, bh: pg.clientHeight };
  handle.setPointerCapture(e.pointerId); el.classList.add("active");
});
document.addEventListener("pointermove", e => {
  if (!nd) return;
  const dx = e.clientX - nd.sx, dy = e.clientY - nd.sy, el = nd.el;
  if (nd.mode === "drag") {
    el.style.left = Math.max(0, Math.min(nd.bw - nd.w, nd.l + dx)) + "px";
    el.style.top = Math.max(0, Math.min(nd.bh - 40, nd.t + dy)) + "px";
  } else {
    el.style.width = Math.max(104, Math.min(nd.bw - nd.l, nd.w + dx)) + "px";
    el.style.height = Math.max(96, Math.min(nd.bw, nd.h + dy)) + "px";
  }
});
function endNote() {
  if (!nd) return;
  const el = nd.el; nd = null; el.classList.remove("active");
  const m = curMem(), n = m && (m.notes || []).find(x => x.id === el.dataset.note), pg = $("#mempage");
  if (!n || !pg) return;
  const bw = pg.clientWidth, r = v => Math.round(v * 1e4) / 1e4;
  n.x = r(el.offsetLeft / bw); n.y = r((el.offsetTop - anchorPx(pg)) / bw); n.ay = 1; n.w = r(el.offsetWidth / bw); n.h = r(el.offsetHeight / bw);
  layoutNotes(); save(); setTimeout(flushPending, 0);
}
["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, endNote));
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-note-act]"); if (!b) return;
  const m = curMem(); if (!m) return;
  m.notes = m.notes || [];
  const act = b.dataset.noteAct, el = b.closest(".postit"), n = el && m.notes.find(x => x.id === el.dataset.note);
  if (act === "new") {
    const pg = $("#mempage"); if (!pg) return;
    const c = m.notes.length, bw = pg.clientWidth;
    const y = Math.max(0.03, (view.getBoundingClientRect().top + 90 - pg.getBoundingClientRect().top) / bw) + (c % 4) * 0.05 - anchorPx(pg) / bw;
    const nn = { id: uid(), ay: 1, text: "", x: Math.min(0.48, 0.08 + (c % 5) * 0.07), y: Math.round(y * 1e4) / 1e4, w: 0.5, h: 0.42, color: NOTE_COLORS[c % NOTE_COLORS.length], rot: ((c * 7) % 5 - 2) * 0.7, pinned: false, by: S.user.name, created: Date.now() };
    m.notes.push(nn); save(); refreshNotes();
    const ta = $(`.postit[data-note="${nn.id}"] textarea`); if (ta) { ta.focus(); ta.closest(".postit").classList.add("sel"); }
  } else if (n) {
    if (act === "pin") n.pinned = !n.pinned;
    else if (act === "color") n.color = NOTE_COLORS[(NOTE_COLORS.indexOf(n.color) + 1) % NOTE_COLORS.length];
    else if (act === "del") { if (!(await askConfirm("The note will be removed for both of you.", { title: "Delete post-it", ok: "Delete" }))) return; m.notes = m.notes.filter(x => x.id !== n.id); }
    save(); refreshNotes();
  }
});
document.addEventListener("input", e => {
  const ta = e.target.closest && e.target.closest("[data-note-text]"); if (!ta) return;
  const m = curMem(), n = m && (m.notes || []).find(x => x.id === ta.closest(".postit").dataset.note);
  if (!n) return;
  n.text = ta.value; if (!n.by) n.by = S.user.name;
  clearTimeout(noteSaveTimer); noteSaveTimer = setTimeout(save, 500);
});
document.addEventListener("focusout", e => {
  if (e.target.matches && e.target.matches("[data-note-text]")) { clearTimeout(noteSaveTimer); save(); setTimeout(flushPending, 0); }
});

/* ---------- In-app confirm dialog ---------- */
let dlgResolve;
function askConfirm(message, { title = "Are you sure?", ok = "Confirm", danger = true } = {}) {
  return new Promise(res => {
    if (dlgResolve) dlgResolve(false);
    dlgResolve = res;
    const d = $("#dialog");
    d.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${esc(title)}</h3><p>${esc(message)}</p><div class="acts"><button class="btn ghost" data-dlg="0">Cancel</button><button class="btn ${danger ? "danger" : "accent"}" data-dlg="1">${esc(ok)}</button></div></div>`;
    d.classList.add("open"); d.querySelector('[data-dlg="0"]').focus();
  });
}
function closeDialog(v) {
  const d = $("#dialog"); d.classList.remove("open"); d.innerHTML = "";
  if (dlgResolve) { const r = dlgResolve; dlgResolve = null; r(v); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-dlg]");
  if (b) closeDialog(b.dataset.dlg === "1");
  else if (e.target.id === "dialog") closeDialog(false);
});

/* ---------- Boot ---------- */
(function boot() {
  setTimeout(() => { if (!S.authReady) { S.authReady = true; render(false); } }, 8000);
})();
</script>

<script>
/* ---------- Revamp overlay: new Home, mini player ---------- */
S.homeFilter = "all";
function myAv() { const a = safeImage(S.profile && S.profile.avatar); return a ? `<img src="${esc(a)}" alt="">` : esc((S.user.name[0] || "?").toUpperCase()); }
function quickFolder(f) { return `<button class="q" data-folder="${f.id}"><span class="sq" style="background-color:${f.color};--fg:${fg(f.color)}">${ico(f.icon)}</span><b>${esc(f.name)}</b></button>`; }

}
renderHome = function () {

function evInfo(e) {

  if (e.yearly) { const [, m, dy] = date.split("-"); let y = +today().slice(0, 4); date = `${y}-${m}-${dy}`; if (dd(today(), date) < 0) date = `${y + 1}-${m}-${dy}`; d = dd(today(), date); }
  return { d, date };
}
function usTop() {
  const days = C.start ? Math.max(0, dd(C.start, today())) : null;
  const evs = Object.values(C.events).map(e => ({ e, ...evInfo(e) })).sort((a, b) => (a.e.done - b.e.done) || (a.e.done ? b.d - a.d : (a.d < 0) - (b.d < 0) || a.d - b.d));

    <small>${esc(S.user.name)} ♥ ${esc(pName())}</small><div class="us-big"><b>${days === null ? "—" : days}</b> days together</div><small>${C.start ? "since " + esc(fmt(C.start)) : "Tap the pencil to set your start date"}</small>
    ${usEdit ? `<div class="us-form"><input id="startD" type="date" value="${esc(C.start || "")}"><button class="chip" data-start-set>Save date</button></div>` : ""}</div>
    <div class="us-tiles">${evs.map(tile).join("") || '<p class="none">No countdowns yet.</p>'}</div>
    ${usEdit ? `<div class="us-form"><input id="evT" placeholder="Trip, birthday…" maxlength="40"><input id="evD" type="date"><select id="evE"><option>🎉</option><option>🎂</option><option>✈️</option><option>💍</option><option>💖</option><option>🎓</option></select><label><input id="evY" type="checkbox"> yearly</label><button class="chip" data-ev-add>Add</button></div>` : ""}</section>`;
}

/* blind daily questions */
const QS = ["What's a memory from last year that still makes you laugh?", "What's a small thing I do that you love?", "Where would you take us for a surprise weekend?", "What song reminds you of us?", "What's something you want us to try this month?", "What's your favorite moment from our last week?", "What did you think when we first met?", "What's a dream you haven't told me about?", "What meal would you want us to cook together?", "What's one thing I made easier for you lately?", "Which photo of us is your favorite and why?", "What are you most looking forward to with me?"];
const sugQ = () => QS[Math.floor(Date.now() / 864e5) % QS.length];
function qCard(asker) {
  const p = (C.prompts[today()] || {})[asker], mine = asker === meId(), who = mine ? "You" : esc(pName());
  if (!asker) return `<p class="q-w">Waiting for your partner to join…</p>`;
  if (!p) return mine ? `<div class="q-t">Ask your question for today</div><textarea id="qIn" maxlength="200" placeholder="${esc(sugQ())}">${esc(drafts.qIn || "")}</textarea><div class="us-form" style="justify-content:flex-start"><button class="chip" data-q-sug>Use today's idea</button><button class="chip on" data-q-ask>Ask</button></div>`
    : `<div class="q-w">${who} haven't asked today's question yet.</div>`;
  const ids = [meId(), pId()].filter(Boolean), a = p.a || {}, both = ids.length === 2 && ids.every(u => a[u]);
  const rows = ids.map(u => u === meId() && !a[u] ? `<textarea id="qa_${esc(asker)}" maxlength="500" placeholder="Your answer…">${esc(drafts["qa_" + asker] || "")}</textarea><button class="chip on" data-q-ans="${esc(asker)}">Submit answer</button>`
    : `<div class="q-a"><b>${u === meId() ? "You" : esc(pName())}</b>${a[u] ? (both ? esc(a[u].text) : '<span class="lk">hidden until you both answer</span>') : "Hasn't answered yet"}</div>`).join("");
  return `<div class="q-t">“${esc(p.q)}”</div><div class="q-w">${mine ? "You asked" : esc(pName()) + " asked"}${both ? " · both answered 🎉" : ""}</div>${rows}`;
}
function usRest() {
  const items = Object.values(C.bucket), nx = items.filter(i => !i.done).sort((a, b) => a.created - b.created)[0];
  const acts = Object.values(C.activity).sort((a, b) => b.at - a.at).slice(0, 5);
  return `<section class="us"><div class="us-box"><div class="us-h"><b>Daily questions</b><small>Answers stay blurred until you both reply</small></div>${qCard(meId())}<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">${qCard(pId())}</div>
    <button class="us-box us-bk" data-bk-open><b>Our bucket list</b><small>${items.filter(i => i.done).length} of ${items.length} done${nx ? " · next: " + esc(nx.text) : ""}</small></button>
    ${acts.length ? `<div class="us-act">${acts.map(a => `<small>${a.uid === meId() ? "You" : esc(a.name || pName())} ${esc(a.text)} · ${ago(a.at)}</small><br>`).join("")}</div>` : ""}</section>`;
}
const _rh = renderHome;

/* reactions */
const RX = ["❤️", "😂", "😮", "🥹", "🔥", "👍"];
function rxChips(t, bar) {
  const r = C.reacts[t] || {}, cnt = {}; Object.values(r).forEach(e => cnt[e] = (cnt[e] || 0) + 1);
  const chips = Object.entries(cnt).map(([e, n]) => `<button class="rx-c${r[meId()] === e ? " me" : ""}" data-rx-chip="${esc(t)}|${e}">${e}${n > 1 ? " " + n : ""}</button>`).join("");
  return chips || bar ? `<div class="rx${bar ? " rx-bar" : ""}">${chips}${bar ? `<button class="rx-add" data-rx-open="${esc(t)}" aria-label="React">☺ +</button>` : ""}</div>` : "";
}
function setReact(t, e) {
  const cur = (C.reacts[t] || {})[meId()];
  if (cur === e) cPatch(["reacts", t, meId()], undefined); else { cPatch(["reacts", t, meId()], e); logAct("react", `reacted ${e} to a ${t.split(":")[0] === "mem" ? "memory" : t.split(":")[0] === "note" ? "note" : "message"}`); }
}
const _rm2 = renderMemory;
renderMemory = function (id) { const h = _rm2(id); ensureC(); return mem(id) ? h.replace("<h2>Photos &amp; music", rxChips("mem:" + id, true) + "<h2>Photos &amp; music") : h; };
const _dn = renderDailyNote;
renderDailyNote = function () {
  let h = _dn(); ensureC(); const pn = partnerInfo().note, own = todaysNote();
  if (own) h = h.replace('    </div>\n    <div class="daily-note-card partner-note">', rxChips(`note:${meId()}:${own.date}`, true) + '    </div>\n    <div class="daily-note-card partner-note">');
  if (pn) h = h.replace("    </div>\n  </section>", rxChips(`note:${pn.uid}:${pn.date}`, true) + "    </div>\n  </section>");
  return h;
};
const _bh = bubHTML;
bubHTML = function (m, mine) { ensureC(); return _bh(m, mine) + rxChips("msg:" + m.id); };
const rp = document.createElement("div"); rp.id = "rpick"; rp.hidden = true; rp.innerHTML = RX.map(e => `<button data-rx-pick="${e}">${e}</button>`).join(""); $("#app").appendChild(rp);
function rxOpen(t, el) { const r = el.getBoundingClientRect(); rp.dataset.t = t; rp.hidden = false; rp.style.top = Math.max(8, r.top - 54) + "px"; rp.style.left = Math.max(8, Math.min(innerWidth - rp.offsetWidth - 8, r.left)) + "px"; }
let lpT, lpDone = false;
document.addEventListener("pointerdown", e => { const b = e.target.closest(".bub"); if (!b || !b.closest("[data-m]")) return; lpDone = false; lpT = setTimeout(() => { lpDone = true; rxOpen("msg:" + b.closest("[data-m]").dataset.m, b); }, 450); });
["pointerup", "pointermove", "pointercancel"].forEach(ev => document.addEventListener(ev, () => clearTimeout(lpT)));
document.addEventListener("dblclick", e => { const b = e.target.closest(".bub"); if (b && b.closest("[data-m]")) rxOpen("msg:" + b.closest("[data-m]").dataset.m, b); });

/* bucket list */
const bkBox = document.createElement("div"); bkBox.id = "bucket"; bkBox.hidden = true; $("#app").appendChild(bkBox);
const BK = ["Places to Visit", "Recipes to Cook", "Games to Play", "Movies to Watch", "Other"];
function bkRender() {
  ensureC(); const items = Object.values(C.bucket).sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || a.created - b.created), cats = [...new Set([...BK, ...items.map(i => i.cat)])];
  const shown = bkCat === "All" ? items : items.filter(i => i.cat === bkCat), sel = bkCat === "All" ? BK[0] : bkCat;
  bkBox.innerHTML = `<div class="bk-top"><button class="ibtn" data-bk-close aria-label="Close">‹</button><div><b>Our bucket list</b><small>${items.filter(i => i.done).length} of ${items.length} done</small></div></div>
    <div class="bk-chips">${["All", ...cats].map(c => `<button class="chip${c === bkCat ? " on" : ""}" data-bk-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    ${shown.map(i => `<div class="bk-i${i.done ? " done" : ""}"><button class="bk-ck" data-bk-tog="${esc(i.id)}" aria-label="Toggle done">${i.done ? "✓" : ""}</button><span>${esc(i.text)}<small>${esc(i.cat)} · added by ${i.by === meId() ? "you" : esc(pName())}</small></span><button class="bk-x" data-bk-del="${esc(i.id)}" aria-label="Delete">×</button></div>`).join("") || '<p class="none">Nothing here yet. Add your first idea below.</p>'}
    <div class="bk-add"><input id="bkT" maxlength="120" placeholder="Add something to do together…"><select id="bkC">${cats.map(c => `<option${c === sel ? " selected" : ""}>${esc(c)}</option>`).join("")}</select><input id="bkN" maxlength="30" placeholder="New category (optional)"><button class="chip on" data-bk-add>Add</button></div>`;
}

  const blur = () => document.activeElement && document.activeElement.blur && document.activeElement.blur();
  let x;
  if (q("[data-rx-pick]")) { setReact(rp.dataset.t, q("[data-rx-pick]").dataset.rxPick); rp.hidden = true; }
  else if ((x = v("[data-rx-open]"))) rxOpen(x, q("[data-rx-open]"));
  else if ((x = v("[data-rx-chip]"))) { const [tg, em] = x.split("|"); setReact(tg, em); }
  else if (q("[data-us-edit]")) { usEdit = !usEdit; render(); }
  else if (q("[data-start-set]")) { const d = $("#startD").value; if (d) { blur(); cPatch(["start"], d); } }
  else if (q("[data-ev-add]")) { const ti = $("#evT").value.trim(), d = $("#evD").value; if (!ti || !d) return toast("Add a title and a date"); const id = "ev" + uidr(); blur(); cPatch(["events", id], { id, title: ti, date: d, emoji: $("#evE").value, yearly: $("#evY").checked, done: false }); }
  else if ((x = v("[data-ev-del]"))) cPatch(["events", x], undefined);
  else if ((x = v("[data-ev-done]"))) { const ev = C.events[x]; if (ev) cPatch(["events", x], { ...ev, done: !ev.done }); }
  else if (q("[data-q-sug]")) { $("#qIn").value = sugQ(); drafts.qIn = sugQ(); }
  else if (q("[data-q-ask]")) { const s = $("#qIn").value.trim(); if (!s) return toast("Write a question first"); blur(); delete drafts.qIn; cPatch(["prompts", today(), meId()], { q: s, at: Date.now() }); logAct("ask", "asked today's question"); }
  else if ((x = v("[data-q-ans]"))) { const s = $("#qa_" + x).value.trim(); if (!s) return toast("Write your answer first"); blur(); delete drafts["qa_" + x]; cPatch(["prompts", today(), x, "a", meId()], { text: s, at: Date.now() }); logAct("answer", "answered a daily question"); }
  else if (q("[data-bk-open]")) { bkOpen = true; bkBox.hidden = false; bkRender(); }
  else if (q("[data-bk-close]")) { bkOpen = false; bkBox.hidden = true; render(); }
  else if ((x = v("[data-bk-cat]"))) { bkCat = x; bkRender(); }
  else if (q("[data-bk-add]")) { const tx = $("#bkT").value.trim(), cat = $("#bkN").value.trim() || $("#bkC").value; if (!tx) return toast("Type something to add"); const id = "b" + uidr(); blur(); cPatch(["bucket", id], { id, text: tx, cat, by: meId(), done: false, created: Date.now() }); logAct("bucket", "added “" + tx.slice(0, 30) + "” to the bucket list"); bkRender(); }
  else if ((x = v("[data-bk-tog]"))) { const it = C.bucket[x]; if (it) { cPatch(["bucket", x], { ...it, done: !it.done }); if (!it.done) logAct("bucket", "checked off “" + it.text.slice(0, 30) + "”"); bkRender(); } }
  else if ((x = v("[data-bk-del]"))) { cPatch(["bucket", x], undefined); bkRender(); }
});
document.addEventListener("input", e => { const id = e.target.id; if (id === "qIn" || (id && id.startsWith("qa_"))) drafts[id] = e.target.value; });

};

</script>

const firebaseConfig = {
  apiKey: "AIzaSyDI49UdrGQ0fswGN0bS8-tSxTVUot5dnTg",

  projectId: "keepsake-7050a",
  
  messagingSenderId: "696512986320",

};

let auth, db;
let saveQueue = Promise.resolve();
window.firebaseErrorMessage = error => {
  const messages = {
    "auth/invalid-credential": "Email or password is incorrect.",
